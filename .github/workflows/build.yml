name: Build PAM module

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpam0g-dev libcurl4-openssl-dev libjson-c-dev

      - name: Build PAM module
        run: |
          make build
          mkdir -p dist
          cp build/pam_ssh_oidc.so dist/pam_ssh_oidc-linux-amd64.so
          strip --strip-unneeded dist/pam_ssh_oidc-linux-amd64.so
          file dist/pam_ssh_oidc-linux-amd64.so
          ldd dist/pam_ssh_oidc-linux-amd64.so
          sha256sum dist/pam_ssh_oidc-linux-amd64.so > dist/SHA256SUMS

      - name: Verify exported PAM symbols
        run: |
          nm -D dist/pam_ssh_oidc-linux-amd64.so | grep ' pam_sm_authenticate$'
          nm -D dist/pam_ssh_oidc-linux-amd64.so | grep ' pam_sm_setcred$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pam-ssh-oidc-linux-amd64
          path: |
            dist/pam_ssh_oidc-linux-amd64.so
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish rolling nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly
          prerelease: true
          make_latest: false
          body: |
            Automatic native C build of the latest `main` commit.

            This release is continuously updated and is intended for testing.
            For stable deployments, use a versioned `v*` release.
          files: |
            dist/pam_ssh_oidc-linux-amd64.so
            dist/SHA256SUMS
          overwrite_files: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pam_ssh_oidc-linux-amd64.so
            dist/SHA256SUMS
          generate_release_notes: true
